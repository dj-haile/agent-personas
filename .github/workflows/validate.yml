name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate persona catalog
        run: python3 scripts/validate.py
